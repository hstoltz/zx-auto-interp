name: exact checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install 'git+https://github.com/Sukyn/minimality-auto.git@1796234999986410d282ccc13aa6669ef6a18fb5'
      - run: python -m unittest -v
      - run: python explore.py --check interpretations.json
      - run: python zx.py phase_free.zx --check phase_free_certificate.json --out /tmp/phasefree-checked.json
      - run: python zx.py bialgebra.zx --out /tmp/certificate.json
      - run: python zx.py bialgebra.zx --check /tmp/certificate.json --out /tmp/rechecked.json
      - run: python colin.py bialgebra.zx /tmp/certificate.json > /tmp/colin-verification.json
